name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p admin/tsconfig.json
      - run: npx tsc --noEmit -p server/tsconfig.json
      - run: npm run verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not set. Add a granular npm token (with 2FA bypass) to Settings -> Secrets and variables -> Actions -> NPM_TOKEN and re-run this workflow."
            exit 1
          fi
          npm publish --provenance --access public
